name: Test Control Studio
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  managed:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/ControlStudio.Core.Tests -c Release -p:RestoreLockedMode=true
      - run: dotnet test tests/ControlStudio.Infrastructure.Tests -c Release -p:RestoreLockedMode=true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - run: python -m unittest discover -s tests/packaging -v
      - run: python scripts/check-source.py
  unsigned-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.6'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.5'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-ios --version 10.0.302.1
      - run: swift test --package-path native
      - run: bash scripts/build-native.sh
      - name: Compile MAUI and embed native products
        run: |
          dotnet restore src/ControlStudio.App/ControlStudio.App.csproj --locked-mode
          dotnet publish src/ControlStudio.App/ControlStudio.App.csproj -c Release --no-restore \
            -p:ArchiveOnBuild=false -p:BuildIpa=false -p:EnableCodeSigning=false
      - run: bash scripts/package-ios.sh unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ControlStudio-m0-unsigned-${{ github.run_number }}
          path: |
            artifacts/ipa/ControlStudio-m0-unsigned.ipa
            artifacts/ipa/validation-unsigned.json
          if-no-files-found: error
          retention-days: 14
