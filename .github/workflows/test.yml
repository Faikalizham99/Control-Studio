name: Test Control Studio
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select and verify pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          test "$(xcodebuild -version | head -1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          xcodebuild -version
      - name: Run native SQLite persistence and concurrency tests
        run: swift test --package-path native
      - name: Compile Swift bridge, WidgetKit and App Intents extensions
        run: bash scripts/build-native.sh
  managed:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet test tests/ControlStudio.Core.Tests -c Release -p:RestoreLockedMode=true
      - run: dotnet test tests/ControlStudio.Infrastructure.Tests -c Release -p:RestoreLockedMode=true
      - run: dotnet test tests/ControlStudio.App.Tests -c Release -p:RestoreLockedMode=true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.7'
      - run: python -m unittest discover -s tests/packaging -v
      - run: python scripts/check-source.py
