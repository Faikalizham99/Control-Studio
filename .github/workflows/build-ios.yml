name: Build Control Studio IPA
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.created == true && github.event.deleted == false
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      signing_mode: ${{ steps.signing-mode.outputs.mode }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SIGNING_MODE: ${{ vars.IOS_SIGNING_MODE || 'unsigned' }}
    steps:
      - name: Validate signing mode
        id: signing-mode
        shell: bash
        run: |
          case "$SIGNING_MODE" in
            unsigned|signed) ;;
            *) echo 'IOS_SIGNING_MODE must be unsigned or signed' >&2; exit 1 ;;
          esac
          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select and verify pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.6'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.5'
          xcodebuild -version
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install pinned MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.302.1
      - name: Record toolchain
        run: |
          dotnet --info
          dotnet workload --info
          xcrun swift --version
      - name: Validate source and signing configuration
        run: |
          python3 scripts/check-source.py
          python3 -m unittest discover -s tests/packaging -v
      - name: Run managed unit tests
        run: |
          dotnet test tests/ControlStudio.Core.Tests -c Release -p:RestoreLockedMode=true
          dotnet test tests/ControlStudio.Infrastructure.Tests -c Release -p:RestoreLockedMode=true
          dotnet test tests/ControlStudio.App.Tests -c Release -p:RestoreLockedMode=true
      - name: Run native SQLite persistence and concurrency tests
        run: swift test --package-path native
      - name: Test offline snippet formatting and rendering
        run: node --test tests/snippets/viewer.test.cjs
      - name: Compile Swift bridge, WidgetKit and App Intents extensions
        run: bash scripts/build-native.sh
      - name: Restore and compile MAUI host with native extensions
        run: |
          dotnet restore src/ControlStudio.App/ControlStudio.App.csproj --locked-mode
          dotnet publish src/ControlStudio.App/ControlStudio.App.csproj -c Release --no-restore \
            -p:ArchiveOnBuild=false -p:BuildIpa=false -p:EnableCodeSigning=false
      - name: Import signing material into temporary keychain
        if: env.SIGNING_MODE == 'signed'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_HOST_PROFILE_BASE64: ${{ secrets.IOS_HOST_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          IOS_INTENTS_PROFILE_BASE64: ${{ secrets.IOS_INTENTS_PROFILE_BASE64 }}
        run: bash scripts/install-signing.sh
      - name: Package and validate final IPA
        run: bash scripts/package-ios.sh "$SIGNING_MODE"
      - name: Upload IPA and validation report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ControlStudio-m1-${{ env.SIGNING_MODE }}-${{ github.run_number }}
          path: |
            artifacts/ipa/ControlStudio-m1-${{ env.SIGNING_MODE }}.ipa
            artifacts/ipa/validation-${{ env.SIGNING_MODE }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${SIGNING_TEMP_DIR:-}" ]]; then
            case "$SIGNING_TEMP_DIR" in "$RUNNER_TEMP"/controlstudio-signing.*) rm -rf -- "$SIGNING_TEMP_DIR" ;; *) exit 1 ;; esac
          fi
  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SIGNING_MODE: ${{ needs.build.outputs.signing_mode }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ControlStudio-m1-${{ needs.build.outputs.signing_mode }}-${{ github.run_number }}
          path: release
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "release/ControlStudio-m1-$SIGNING_MODE.ipa" "release/validation-$SIGNING_MODE.json" --verify-tag --generate-notes --draft
